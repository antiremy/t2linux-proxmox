name: Build kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.env
      - config-t2.opts
      - patches/**
      - build.sh
      - publish-apt.sh
      - meta/**
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          docker image prune -af
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            -e WORK=/repo/work -e OUT=/repo/out -e CCACHE_DIR=/repo/ccache \
            debian:trixie /repo/build.sh

      - name: Save ccache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ccache
          key: ccache-${{ github.run_id }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debs
          path: out/*.deb

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source config.env
          kernel=$(ls out/proxmox-kernel-*-pve_*.deb | grep -v signed | head -1 | sed 's|out/proxmox-kernel-||; s|_.*||')
          tag="v${kernel}.${T2_REL}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.deb --clobber
          else
            gh release create "$tag" out/*.deb \
              --title "$kernel" \
              --notes "Proxmox kernel $kernel with t2linux patches ($T2_PATCHES_REF)."
          fi

      - name: Publish to apt repo
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::warning::APT_SIGNING_KEY is not set, skipping the apt repo"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          ./publish-apt.sh
