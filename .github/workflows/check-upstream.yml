name: Check upstream

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Look for a new Proxmox kernel
        id: check
        run: |
          set +e
          ./check-upstream.sh | tee check.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Merge update and start build
        if: steps.check.outputs.code == '10'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          branch="upstream/$VERSION"
          title="Update to Proxmox kernel $VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "$title"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" --body "$(cat check.log)" || true
          gh pr merge "$branch" --squash --delete-branch
          gh workflow run build.yml --ref main

      - name: Open an issue for a new Linux version
        if: steps.check.outputs.code == '20'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Proxmox kernel moved to a new Linux version"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq length)
          [ "$open" = 0 ] || exit 0
          gh issue create --title "$title" --body "$(cat check.log)

          Set T2_PATCHES_REF in config.env to the last t2linux commit for the new version, then run the quick patch check."

      - name: Fail on errors
        if: ${{ !contains(fromJSON('["0","10","20"]'), steps.check.outputs.code) }}
        run: exit 1
